<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>moodle+R UI改善 設定</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    max-width: 640px;
    margin: 24px auto;
    padding: 0 16px;
    color: #222;
  }
  h1 { font-size: 1.4em; }
  h2 { font-size: 1.1em; margin-top: 2em; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  label { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .rlx-periods-table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  .rlx-periods-table th, .rlx-periods-table td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
  .rlx-periods-table input[type="time"] { width: 100%; box-sizing: border-box; }
  button#save { margin-top: 24px; padding: 8px 20px; font-size: 1em; cursor: pointer; }
  #status { margin-left: 12px; color: #2f6feb; }
</style>
</head>
<body>
<h1>moodle+R UI改善 設定</h1>

<h2>機能のON/OFF</h2>
<label><input type="checkbox" id="feature-timetable" /> F1: 時間割の一覧性改善</label>
<label><input type="checkbox" id="feature-deadlines" /> F2: 課題・小テスト（締切順）ブロック</label>
<label><input type="checkbox" id="feature-courseTabs" /> F3: コース画面の種別分類タブ</label>
<label><input type="checkbox" id="feature-courseIndex" /> F4: コースインデックスのツリー化</label>
<label><input type="checkbox" id="feature-navMenu" /> 上部ナビゲーションの整理（不要な項目を「…」に集約）</label>

<h2>標準ブロックの非表示</h2>
<p style="color:#666;font-size:0.9em;margin:4px 0 12px;">タイムラインは時間割の下に再配置、最近アクセスされたアイテムは課題・小テスト（締切順）に置き換えられるため、ここでは切り替えられません。</p>
<label><input type="checkbox" id="hide-courseOverview" /> コース概要</label>

<h2>時限の時刻対応表</h2>
<table class="rlx-periods-table">
  <thead>
    <tr><th>時限</th><th>開始</th><th>終了</th></tr>
  </thead>
  <tbody id="periods-body"></tbody>
</table>

<button id="save">保存</button>
<span id="status"></span>

<script src="../src/lib/settings.js"></script>
<script src="options.js"></script>
</body>
</html>
